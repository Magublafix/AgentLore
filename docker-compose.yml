services:
  lore-selfhosted:
    build:
      context: .
      dockerfile: lore/selfhosted/Dockerfile
    image: lore/selfhosted
    ports:
      - "8765:8765"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LORE_DB_PATH: /data/lore.db
    volumes:
      - lore-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # Use Python urllib — curl is not installed in the minimal runtime image.
      # Matches the Dockerfile HEALTHCHECK exactly.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  lore-data:
  qdrant-data:
