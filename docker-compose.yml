services:
  lore-selfhosted:
    build:
      context: .
      dockerfile: lore/selfhosted/Dockerfile
    image: lore/selfhosted
    pull_policy: build
    ports:
      - "8765:8765"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LORE_DB_PATH: /data/lore.db
      LORE_ADMIN_TOKEN: "${LORE_ADMIN_TOKEN:-benchmark-reset-token}"
    volumes:
      - lore-data:/data
      - lore-model-cache:/app/.cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # Use Python urllib — curl is not installed in the minimal runtime image.
      # Matches the Dockerfile HEALTHCHECK exactly.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  lore-data:
  qdrant-data:
  lore-model-cache:
