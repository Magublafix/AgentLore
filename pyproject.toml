[project]
name = "lore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.6.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]
