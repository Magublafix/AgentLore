[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-lore"
version = "0.1.0"
description = "A typed, linked knowledge graph for AI coding agents — MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.scripts]
mcp-server-lore = "lore.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
