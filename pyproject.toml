[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-lore"
version = "1.0.0"
description = "A typed, linked knowledge graph for AI coding agents — MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "magublafix"},
]
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/Magublafix/AgentLore"
Repository = "https://github.com/Magublafix/AgentLore"
Issues = "https://github.com/Magublafix/AgentLore/issues"

[project.scripts]
mcp-server-lore = "lore.mcp.server:main"

[project.optional-dependencies]
# Heavy selfhosted backend — sentence-transformers pulls PyTorch (~2 GB).
# Install with: pip install "mcp-server-lore[selfhosted]"
selfhosted = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
