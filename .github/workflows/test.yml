name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Cache pip's wheel/package cache AND the installed virtualenv so that
      # repeated runs skip the download + compile step for all C-extension
      # packages (numpy, torch, qdrant-client, etc.).
      # Key includes pyproject.toml hash — any dependency change busts the cache.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.venv
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      # Cache the HuggingFace model directory.
      # all-MiniLM-L6-v2 is ~90 MB; the cache key is stable (model name is
      # pinned by sentence-transformers internally, not the pyproject hash).
      # We also include the pyproject hash so a transformers major version bump
      # triggers a re-download rather than a stale model mismatch.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        # Only reinstall if the cache was not fully restored. The `~/.venv`
        # directory is part of the pip cache key, so a cache hit means the venv
        # is already populated — skip reinstall to keep runs fast.
        run: |
          if [ ! -f ~/.venv/bin/activate ]; then
            python -m venv ~/.venv
          fi
          source ~/.venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # TRANSFORMERS_OFFLINE=1 prevents the HuggingFace hub from making
        # outbound requests during the test run. If the model is cached, it loads
        # from ~/.cache/huggingface. If it is not cached (first run), the install
        # step above will have pulled it via sentence-transformers during import.
        # We keep TRANSFORMERS_OFFLINE off on first run by checking the cache.
        run: |
          source ~/.venv/bin/activate
          if [ -d ~/.cache/huggingface/hub ]; then
            export TRANSFORMERS_OFFLINE=1
          fi
          pytest lore/tests/ --cov=lore --cov-fail-under=80
