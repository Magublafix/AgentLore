name: Build and push Docker image

on:
  push:
    branches:
      - main

# GITHUB_TOKEN needs packages:write to push to ghcr.io.
# contents:read is the minimum for checkout.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build lore-selfhosted image
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 0. Free disk space — ubuntu-latest has ~14 GB free by default.
      #    PyTorch + sentence-transformers layers fill the disk mid-build.
      #    Removing Android SDK, .NET, and large pre-installed tool sets
      #    recovers ~20 GB before BuildKit starts pulling layers.
      # -----------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          df -h

      # -----------------------------------------------------------------------
      # 1. Checkout — full repo needed because the Dockerfile copies both
      #    pyproject.toml and lore/ from the repo root as the build context.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up BuildKit.  docker/build-push-action@v6 enables BuildKit
      #    automatically, but we call setup-buildx explicitly so we can
      #    reference the builder instance for cache operations.
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 3. Authenticate to GitHub Container Registry.
      #    github.actor is the user (or bot) that triggered the push.
      #    GITHUB_TOKEN is injected automatically by Actions.
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. Generate image tags.
      #    - latest        — always points to the most recent main build
      #    - <sha7>        — immutable, traceble back to the exact commit
      #
      #    docker/metadata-action normalises the registry + repo name and
      #    strips invalid characters from the SHA ref automatically.
      # -----------------------------------------------------------------------
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/magublafix/lore-selfhosted
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # -----------------------------------------------------------------------
      # 5. Build and push.
      #
      #    Build context: repo root (.) — the Dockerfile references both
      #    pyproject.toml and lore/ relative to the repo root.
      #
      #    Dockerfile path: lore/selfhosted/Dockerfile
      #
      #    Layer cache: type=gha stores BuildKit cache in the GitHub Actions
      #    cache service (same backend as actions/cache).  mode=max preserves
      #    intermediate layers, which is critical here because the PyTorch /
      #    sentence-transformers wheels live in the builder stage and are
      #    expensive to re-download on every run (~1-2 GB).
      #
      #    push: true — image is pushed only when this step succeeds.  If the
      #    build exits non-zero, the step fails immediately and the push is
      #    skipped, satisfying the "fail fast" requirement.
      # -----------------------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lore/selfhosted/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
