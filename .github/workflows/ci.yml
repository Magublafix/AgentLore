name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Cache pip's wheel/package download cache.
      # Key is tied to the pyproject.toml hash — any dependency change busts
      # the cache and forces a fresh download.
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest lore/tests/ --cov=lore --cov-fail-under=80 -q
