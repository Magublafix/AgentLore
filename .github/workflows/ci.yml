name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && echo "Qdrant ready" && break
            echo "Waiting for Qdrant... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:6333/healthz || (echo "Qdrant did not start" && exit 1)

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Cache pip's wheel/package download cache.
      # Key is tied to the pyproject.toml hash — any dependency change busts
      # the cache and forces a fresh download.
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest lore/tests/ --cov=lore --cov-fail-under=80 -q
