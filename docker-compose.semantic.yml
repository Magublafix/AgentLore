# Lore semantic search stack — companion to the gists backend
#
# Runs the semantic search server (FastAPI + Qdrant + background watcher).
# The watcher indexes public [agentlore-concept] GitHub gists into Qdrant so
# search_concepts uses vector similarity instead of tag-only matching.
#
# Concepts are stored on GitHub Gists — this stack provides the search index only.
#
# Usage:
#   LORE_GITHUB_TOKEN=ghp_... docker compose -f docker-compose.semantic.yml up -d
#
# Then point the MCP server at it:
#   claude mcp add lore \
#     -e LORE_BACKEND=gists \
#     -e LORE_GITHUB_TOKEN=ghp_... \
#     -e LORE_SEMANTIC_URL=http://localhost:8766 \
#     -- uvx mcp-server-lore
#
# Qdrant is intentionally not mapped to host ports to avoid collision with
# the selfhosted stack (docker-compose.yml) if both are running.

services:
  semantic-server:
    build:
      context: .
      dockerfile: lore/semantic_server/Dockerfile
    image: lore/semantic-server
    ports:
      - "8766:8766"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LORE_STORAGE_BACKEND: gist_qdrant
      LORE_GITHUB_TOKEN: "${LORE_GITHUB_TOKEN}"
    volumes:
      - semantic-model-cache:/app/.cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    # No host port mapping — reachable only within this compose network.
    expose:
      - "6333"
      - "6334"
    volumes:
      - semantic-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  semantic-qdrant-data:
  semantic-model-cache:
